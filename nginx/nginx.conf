events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name sso.tfm.local;
        return 301 https://$host$request_uri;
    }

    # Configuración del Proxy Inverso Seguro con SSL/TLS
    server {
        listen 443 ssl;
        server_name sso.tfm.local;

        # Rutas a los certificados que generaste
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Enrutamiento hacia el clúster de Keycloak
        location / {
            proxy_pass http://keycloak_node1:8080; # Balanceará al nodo 1 (o al 2 si lo configuras)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}